name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black pytest httpx

      - name: Lint (ruff)
        run: ruff check app/

      - name: Format check (black)
        run: black --check app/

      - name: Run tests
        env:
          GROQ_API_KEY: test-key-for-ci
          EMAIL_ADDRESS: ci@test.com
          EMAIL_PASSWORD: ci-test-pass
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-testing
        run: pytest tests/ -v --tb=short