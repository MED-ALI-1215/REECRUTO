[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function call in default arguments (FastAPI Depends pattern)
    "E501",  # line too long (black handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]   # unused imports fine in tests
